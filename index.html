<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14111f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pixel Calcio" />
    <meta name="description" content="Calcio arcade 2D in pixel art: 5 contro 5 contro la CPU, da giocare sul telefono." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./assets/icon-192-CexrgBEm.png" />
    <link rel="apple-touch-icon" href="./assets/icon-192-CexrgBEm.png" />
    <title>Pixel Calcio Arcade</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #14111f;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      #game canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #14111f;
        color: #ffd23f;
        font: 14px/1.8 monospace;
        text-align: center;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 24px;
        box-sizing: border-box;
      }
      #rotate .phone {
        width: 46px;
        height: 80px;
        border: 4px solid #ffd23f;
        border-radius: 8px;
        margin-bottom: 20px;
        animation: turn 1.6s ease-in-out infinite;
      }
      @keyframes turn {
        0%, 30% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(-90deg); }
      }
      @media (orientation: portrait) and (max-width: 900px) {
        #rotate { display: flex; }
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #8a8fb0;
        font: 12px monospace;
      }
    </style>
    <script type="module" crossorigin src="./assets/game-CeZ9XMBR.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/game-CWliTIKB.css">
  </head>
  <body>
    <div id="loading">Caricamento…</div>
    <script>
      // Paracadute: se il gioco non parte (file mancante dopo un aggiornamento, cache
      // vecchia, errore all'avvio) si svuota la cache e si ricarica una volta da sola;
      // se ancora non va, si mostra il motivo e un bottone per riprovare.
      (function () {
        var KEY = 'pixel-calcio:ricarica';
        var why = '';
        var t0 = Date.now();
        function flag(v) {
          try {
            if (v === undefined) return sessionStorage.getItem(KEY);
            if (v) sessionStorage.setItem(KEY, '1');
            else sessionStorage.removeItem(KEY);
          } catch (e) {}
          return null;
        }
        function clean() {
          var jobs = [];
          try {
            if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
            if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
          } catch (e) {}
          return Promise.all(jobs).catch(function () {});
        }
        function reload() {
          clean().then(function () {
            location.replace(location.pathname + '?v=' + Date.now());
          });
        }
        function fail() {
          var el = document.getElementById('loading');
          if (!el || el.dataset.fail) return;
          if (!flag()) {
            flag(true);
            el.textContent = 'Aggiorno il gioco…';
            reload();
            return;
          }
          el.dataset.fail = '1';
          el.style.flexDirection = 'column';
          el.style.gap = '14px';
          el.style.textAlign = 'center';
          el.style.padding = '20px';
          el.innerHTML = '<div>Il gioco non è partito.</div><div style="font-size:10px;opacity:.7"></div><button style="font:12px monospace;padding:10px 18px;background:#e8443a;color:#fff;border:0;border-radius:4px">RIPROVA</button>';
          el.children[1].textContent = why || 'caricamento troppo lento';
          el.children[2].onclick = function () { flag(false); flag(true); el.textContent = 'Aggiorno il gioco…'; reload(); };
        }
        window.addEventListener('error', function (e) {
          if (!document.getElementById('loading')) return;
          var t = e.target;
          why = t && t.tagName === 'SCRIPT' ? 'file del gioco non trovato' : String(e.message || 'errore');
          setTimeout(fail, 300);
        }, true);
        var iv = setInterval(function () {
          if (!document.getElementById('loading')) {
            // partito: si toglie il segno della ricarica e anche ?v= dall'indirizzo
            clearInterval(iv);
            flag(false);
            if (location.search.indexOf('v=') >= 0) try { history.replaceState(null, '', location.pathname); } catch (e) {}
          } else if (Date.now() - t0 > 25000) {
            clearInterval(iv);
            fail();
          }
        }, 500);
      })();
    </script>
    <div id="game"></div>
    <div id="rotate">
      <div class="phone"></div>
      <div>Ruota il telefono<br />per giocare</div>
    </div>
  </body>
</html>
