name: Controlli

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm ci se c'è package-lock.json, altrimenti npm install (es. export senza lock)
      - run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - run: npm test
      - run: npm run build
